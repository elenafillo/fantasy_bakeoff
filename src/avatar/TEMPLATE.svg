<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" font-family="Nunito, 'Segoe UI', system-ui, sans-serif">

  <!-- Fantasy Bake Off — avatar part drawing template.
       Every part (treat, eyes, mouth) is drawn on the same 48 x 48 canvas
       with the same origin, so the three stack with no alignment work.
       See DESIGN.md §11. -->

  <defs>
    <!-- The worked example: one treat, one pair of eyes, one mouth. -->
    <g id="treat">
      <path d="M24 4.2 v2.2" stroke="#6a8f4a" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="24" cy="6.6" r="2.5" fill="#d94f6a" stroke="#3d2b33" stroke-width="1.4"/>
      <path d="M11 20 C11 14.5 14.5 11.6 18 11.6 C19.1 9.6 21.4 8.8 24 8.8 C26.6 8.8 28.9 9.6 30 11.6 C33.5 11.6 37 14.5 37 20 Z"
            fill="#f2a0bd" stroke="#3d2b33" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M12.5 20 H35.5 L31.5 39.4 C31.3 40.7 30.5 41.4 29.3 41.4 H18.7 C17.5 41.4 16.7 40.7 16.5 39.4 Z"
            fill="#f7d9a8" stroke="#3d2b33" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g id="eyes" fill="#3d2b33">
      <circle cx="19.5" cy="25" r="1.9"/>
      <circle cx="28.5" cy="25" r="1.9"/>
    </g>
    <g id="mouth">
      <path d="M20.5 31 Q24 34.8 27.5 31" fill="none"
            stroke="#3d2b33" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <clipPath id="disc"><circle cx="24" cy="24" r="21"/></clipPath>

    <!-- The assembled avatar, drawn in the same 48-unit space so it can be
         placed at any real size with a single scale(). -->
    <g id="avatarBlue">
      <g clip-path="url(#disc)">
        <circle cx="24" cy="24" r="21" fill="#d4e4f7"/>
        <use href="#treat"/><use href="#eyes"/><use href="#mouth"/>
      </g>
      <circle cx="24" cy="24" r="22.5" fill="none" stroke="#ffffff" stroke-width="3"/>
      <circle cx="24" cy="24" r="23.8" fill="none" stroke="#f0dde4" stroke-width="0.6"/>
    </g>
    <g id="avatarOrange">
      <g clip-path="url(#disc)">
        <circle cx="24" cy="24" r="21" fill="#fbe1d6"/>
        <use href="#treat"/><use href="#eyes"/><use href="#mouth"/>
      </g>
      <circle cx="24" cy="24" r="22.5" fill="none" stroke="#ffffff" stroke-width="3"/>
      <circle cx="24" cy="24" r="23.8" fill="none" stroke="#f0dde4" stroke-width="0.6"/>
    </g>
    <g id="avatarAqua">
      <g clip-path="url(#disc)">
        <circle cx="24" cy="24" r="21" fill="#d1efe4"/>
        <use href="#treat"/><use href="#eyes"/><use href="#mouth"/>
      </g>
      <circle cx="24" cy="24" r="22.5" fill="none" stroke="#ffffff" stroke-width="3"/>
      <circle cx="24" cy="24" r="23.8" fill="none" stroke="#f0dde4" stroke-width="0.6"/>
    </g>
  </defs>

  <rect width="640" height="490" fill="#fbebf1"/>

  <text x="32" y="34" font-size="19" font-weight="800" fill="#3d2b33">Avatar part template — 48 × 48</text>
  <text x="32" y="55" font-size="12.5" fill="#8a7078">Treat, eyes and mouth are three separate files on this same canvas, same origin. They stack in that order.</text>

  <!-- ==================== Panel A: the guides ==================== -->
  <g transform="translate(56 76)">
    <rect width="192" height="192" fill="#ffffff" stroke="#c9b3bb" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- safe circle -->
    <circle cx="96" cy="96" r="84" fill="#fdf4f7" stroke="#e8709c" stroke-width="1.5"/>

    <!-- face box -->
    <rect x="56" y="80" width="80" height="64" fill="#eaf4ff" stroke="#2a78d6" stroke-width="1.5"/>
    <line x1="56" y1="112" x2="136" y2="112" stroke="#2a78d6" stroke-width="1" stroke-dasharray="3 3"/>

    <text x="96" y="100" font-size="10.5" font-weight="800" fill="#2a78d6" text-anchor="middle">EYES</text>
    <text x="96" y="132" font-size="10.5" font-weight="800" fill="#2a78d6" text-anchor="middle">MOUTH</text>

    <!-- centre marks -->
    <line x1="96" y1="0" x2="96" y2="192" stroke="#c9b3bb" stroke-width="0.75" stroke-dasharray="2 4"/>

    <!-- dimensions -->
    <g stroke="#3d2b33" stroke-width="1" fill="none">
      <line x1="56" y1="158" x2="136" y2="158"/>
      <line x1="56" y1="154" x2="56" y2="162"/><line x1="136" y1="154" x2="136" y2="162"/>
      <line x1="148" y1="80" x2="148" y2="144"/>
      <line x1="144" y1="80" x2="152" y2="80"/><line x1="144" y1="144" x2="152" y2="144"/>
    </g>
    <text x="96" y="172" font-size="11" font-weight="700" fill="#3d2b33" text-anchor="middle">20</text>
    <text x="156" y="116" font-size="11" font-weight="700" fill="#3d2b33">16</text>

    <text x="54" y="74" font-size="9.5" fill="#8a7078" text-anchor="end">14, 20</text>
    <text x="140" y="156" font-size="9.5" fill="#8a7078">34, 36</text>
    <text x="96" y="24" font-size="10" font-weight="800" fill="#e8709c" text-anchor="middle">safe circle r 21</text>
  </g>
  <text x="152" y="290" font-size="11.5" font-weight="800" fill="#3d2b33" text-anchor="middle">THE GUIDES</text>

  <!-- ==================== Panel B: worked example ==================== -->
  <g transform="translate(360 76)">
    <rect width="192" height="192" fill="#ffffff" stroke="#c9b3bb" stroke-width="1" stroke-dasharray="4 3"/>
    <circle cx="96" cy="96" r="84" fill="#d4e4f7"/>
    <g transform="scale(4)" clip-path="url(#disc)">
      <use href="#treat"/><use href="#eyes"/><use href="#mouth"/>
    </g>
    <circle cx="96" cy="96" r="84" fill="none" stroke="#e8709c" stroke-width="1.5"/>
    <rect x="56" y="80" width="80" height="64" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
    <line x1="56" y1="112" x2="136" y2="112" stroke="#2a78d6" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
  <text x="456" y="290" font-size="11.5" font-weight="800" fill="#3d2b33" text-anchor="middle">A TREAT DRAWN TO THEM</text>
  <text x="456" y="307" font-size="10.5" fill="#8a7078" text-anchor="middle">Decoration above the face box. The body fills it, flat and pale.</text>

  <!-- ==================== Bottom: real sizes ==================== -->
  <g transform="translate(32 330)">
    <rect width="576" height="130" rx="16" fill="#ffffff"/>

    <g transform="translate(20 5) scale(2.5)"><use href="#avatarBlue"/></g>
    <g transform="translate(164 65) scale(0.8333)"><use href="#avatarOrange"/></g>
    <g transform="translate(224 81) scale(0.5)"><use href="#avatarAqua"/></g>

    <text x="20" y="140" font-size="10" fill="#8a7078">120px</text>
    <text x="164" y="140" font-size="10" fill="#8a7078">40px</text>
    <text x="224" y="140" font-size="10" fill="#8a7078">24px</text>

    <text x="290" y="30" font-size="11.5" font-weight="800" fill="#3d2b33">EVERY SIZE, ONE FILE</text>
    <text x="290" y="50" font-size="11" fill="#3d2b33">Vector, so it stays crisp at 24px and at 120px.</text>
    <text x="290" y="68" font-size="11" fill="#3d2b33">The disc behind is the player’s colour, lightened —</text>
    <text x="290" y="84" font-size="11" fill="#3d2b33">sixteen of them, so treats need a dark outline to</text>
    <text x="290" y="100" font-size="11" fill="#3d2b33">read against any of them. Same treat above,</text>
    <text x="290" y="116" font-size="11" fill="#3d2b33">three different players.</text>
  </g>
  <text x="32" y="484" font-size="10" fill="#8a7078">Pink circle r 21 = the clip. Anything outside it is cut off by the white ring. Blue box = eyes and mouth live here, nothing else does.</text>
</svg>
